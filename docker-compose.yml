x-base:
  restart: unless-stopped
  networks:
  - default
services:
  notifiarr:
    restart: unless-stopped
    networks:
    - default
    image: golift/notifiarr:latest
    hostname: notifiarr-l
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Chicago
    volumes:
    - notifiarr-l-swarm_config:/config
    ports:
    - target: 5454
      published: 5454
      protocol: tcp
      mode: host
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.labels.deployment.target.notifiarr == true
        - node.hostname==ore-dock-110-1
      restart_policy:
        condition: any
        delay: 5s
volumes:
  notifiarr-l-swarm_config:
    name: notifiarr-l-swarm_config
networks:
  default:
    external: true
    name: bridge
